name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Restore .NET
        run: dotnet restore

      - name: Build .NET
        run: dotnet build -c Release --no-restore

      - name: Publish GitCopy win-x64 Native AOT
        run: dotnet publish -c Release -r win-x64 -o artifacts\gitcopy\win-x64

      - name: Install VS Code extension dependencies
        working-directory: vscode-extension
        run: npm install --no-audit --no-fund

      - name: Compile VS Code extension
        working-directory: vscode-extension
        run: npm run compile

      - name: Bundle GitCopy engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vscode-extension\bin | Out-Null
          Copy-Item artifacts\gitcopy\win-x64\GitCopy.exe vscode-extension\bin\GitCopy.exe

      - name: Package VSIX
        working-directory: vscode-extension
        run: npm run package:vsix -- --out ..\artifacts\gitcopy-vscode.vsix

      - name: Report packaged sizes
        shell: pwsh
        run: |
          $engine = Get-Item artifacts\gitcopy\win-x64\GitCopy.exe
          $vsix = Get-Item artifacts\gitcopy-vscode.vsix
          Write-Host ("GitCopy.exe: {0:N2} MB" -f ($engine.Length / 1MB))
          Write-Host ("gitcopy-vscode.vsix: {0:N2} MB" -f ($vsix.Length / 1MB))

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitcopy-windows
          path: |
            artifacts/gitcopy/win-x64/GitCopy.exe
            artifacts/gitcopy-vscode.vsix
